services:
  finance-db:
    image: postgres:15-alpine
    container_name: finance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - finance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d finance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  finance-api:
    build:
      context: ./finance-api
      dockerfile: Dockerfile
    container_name: finance-api
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://finance-db:5432/finance_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      FINANCE_DELAY_MS: 0   # Đặt 5000 khi muốn kiểm thử timeout của Portal
    depends_on:
      finance-db:
        condition: service_healthy

volumes:
  finance_pgdata:
