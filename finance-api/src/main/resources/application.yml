spring:
  application:
    name: finance-api

server:
  port: 8082

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance_db}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

finance:
  delay-ms: ${FINANCE_DELAY_MS:0}     # Biến môi trường để giả lập Finance chậm (timeout testing)
