$kind: http-request
name: F-05: Cập nhật trạng thái không hợp lệ (400 Bad Request)
method: PUT
url: "{{base_url}}/api/tuitions/1/status"
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: '{"status": "DONE"}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
      pm.test("Error message indicates invalid status", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status).to.eql(400);
          pm.expect(jsonData.message).to.eql("Trạng thái chỉ nhận PAID hoặc UNPAID");
      });
order: 5000
