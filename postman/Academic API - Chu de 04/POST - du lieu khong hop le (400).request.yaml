$kind: http-request
url: "{{baseUrl}}/api/students"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "studentId": "B22DCCN014",
      "fullName": "Invalid Email",
      "email": "not-an-email",
      "className": "D22CQCN01-B",
      "major": "Cong nghe thong tin"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 400', function () { pm.response.to.have.status(400); });
      pm.test('Dung error schema', function () { const b = pm.response.json(); pm.expect(b.error).to.eql('BAD_REQUEST'); pm.expect(b.status).to.eql(400); });
    language: text/javascript
order: 5000
